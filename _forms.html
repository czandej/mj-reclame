<!DOCTYPE html>

<html lang="pl">
<head>
<meta charset="utf-8"/>
<title>Netlify Forms — MJ Reclame</title>
<link data-mj-dynamic-bg="true" href="dynamic-background.css" rel="stylesheet"/><link data-mj-favicon="true" href="/favicon.ico" rel="icon" sizes="any"/><link data-mj-favicon="true" href="/favicon-48x48.png" rel="icon" sizes="48x48" type="image/png"/><link data-mj-favicon="true" href="/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png"/><link data-mj-favicon="true" href="/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png"/><link data-mj-favicon="true" href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180"/><link data-mj-favicon="true" href="/site.webmanifest" rel="manifest"/><meta content="#080d0b" data-mj-favicon="true" name="theme-color"/></head>
<body class="mj-dynamic-bg mj-bg-page">
<form data-netlify="true" enctype="multipart/form-data" hidden="" method="POST" name="kontakt-mj-reclame" netlify="" netlify-honeypot="bot-field">
<input name="form-name" type="hidden" value="kontakt-mj-reclame"/>
<input name="language" type="hidden"/>
<input name="subject" type="hidden"/>
<input name="autoresponder_template" type="hidden"/>
<input name="product_code" type="hidden"/>
<input name="product_size" type="hidden"/>
<input name="product_color" type="hidden"/>
<input name="product_quantity" type="hidden"/>
<input name="product_inquiry" type="hidden"/>
<input name="bot-field" type="text"/>
<input name="name" type="text"/>
<input name="email" type="email"/>
<input name="phone" type="tel"/>
<input name="service" type="text"/>
<input name="quantity" type="text"/>
<input name="deadline" type="text"/>
<textarea name="message"></textarea>
<input name="grafika_1" type="file"/>
<input name="grafika_2" type="file"/>
<input name="grafika_3" type="file"/>
<input name="grafika_4" type="file"/>
<input name="grafika_5" type="file"/>
<input name="privacy_acceptance" type="checkbox"/>
</form>

<h1>Netlify Forms</h1>
<p>Techniczna strona wykrywania formularzy Netlify. Nie usuwać.</p>

</body>
</html>
