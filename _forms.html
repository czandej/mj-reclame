<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>Netlify Forms Detector</title></head>
<body>
<form name="kontakt-mj-reclame" method="POST" action="/pl/dziekujemy" data-netlify="true" netlify netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
  <input type="hidden" name="form-name" value="kontakt-mj-reclame">
  <input type="hidden" name="language">
  <input type="hidden" name="subject">
  <input type="hidden" name="autoresponder_template">
  <input type="hidden" name="product_code">
  <input type="hidden" name="product_size">
  <input type="hidden" name="product_color">
  <input type="hidden" name="product_quantity">
  <input type="hidden" name="product_inquiry">
  <input type="text" name="bot-field">
  <input type="text" name="name">
  <input type="email" name="email">
  <input type="tel" name="phone">
  <input type="text" name="service">
  <input type="text" name="quantity">
  <input type="text" name="deadline">
  <textarea name="message"></textarea>
  <input type="file" name="grafika_1">
  <input type="file" name="grafika_2">
  <input type="file" name="grafika_3">
  <input type="file" name="grafika_4">
  <input type="file" name="grafika_5">
  <input type="checkbox" name="privacy_acceptance">
</form>

<form name="powiadomienie-grafika-do-akceptacji" method="POST" data-netlify="true" netlify hidden>
  <input type="hidden" name="form-name" value="powiadomienie-grafika-do-akceptacji">
  <input type="hidden" name="language">
  <input type="hidden" name="typ_zgloszenia">
  <input type="hidden" name="adresat_powiadomienia">
  <input type="email" name="email_uzytkownika">
  <input type="text" name="tytul">
  <input type="text" name="kategoria">
  <textarea name="opis"></textarea>
  <input type="text" name="nazwa_pliku">
  <input type="text" name="sciezka_pliku">
  <input type="text" name="data_zgloszenia">
  <input type="text" name="panel_administratora">
</form>

<form name="powiadomienie-tekst-do-akceptacji" method="POST" data-netlify="true" netlify hidden>
  <input type="hidden" name="form-name" value="powiadomienie-tekst-do-akceptacji">
  <input type="hidden" name="language">
  <input type="hidden" name="typ_zgloszenia">
  <input type="hidden" name="adresat_powiadomienia">
  <input type="email" name="email_uzytkownika">
  <input type="text" name="tytul">
  <input type="text" name="kategoria">
  <textarea name="opis"></textarea>
  <textarea name="tresc_tekstu"></textarea>
  <input type="text" name="liczba_znakow">
  <input type="text" name="data_zgloszenia">
  <input type="text" name="panel_administratora">
</form>
</body>
</html>
